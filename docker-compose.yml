services:
  springboot:
    build: ./LiveDiashowBackend
    ports:
      - "12000:8080"
    restart: unless-stopped

  angular:
    build: ./LiveDiashowFrontend
    ports:
      - "12001:80"
    restart: unless-stopped

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ld
    ports:
      - "12002:5432"
    volumes:
      - ldData:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ldData: