<main class="slideshow" aria-label="Diashow">
  @if (image(); as currentImage) {
    <img class="slideshow-image current-image" [class.fading-out]="transitioning()" [src]="currentImage.data" alt="" />
    <time class="creation-time" [class.visible]="showCreationTime()" [attr.datetime]="currentImage.creationDate | date:'yyyy-MM-ddTHH:mm:ss'">
      {{ currentImage.creationDate | date:'HH:mm' }}
    </time>
    @if (nextImage(); as followingImage) {
      <img class="slideshow-image next-image" [class.visible]="transitioning()" [src]="followingImage.data" alt="" />
    }
  } @else if (loading()) {
    <p class="status" role="status">Diashow wird geladen…</p>
  } @else if (error()) {
    <p class="status" role="alert">Das nächste Bild konnte nicht geladen werden.</p>
  }
</main>
